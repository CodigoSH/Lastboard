<!DOCTYPE html>
<html lang="{{.Language}}" dir="{{.Direction}}" class="{{.ThemeClass}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The status bar of an installed app sits directly above the app's own top
         bar, so it wears that bar's colour rather than the accent. Stamped from
         the account's theme like the class on <html> above, so it is right from
         the first byte; ThemeService rewrites it when the theme is toggled,
         which Chrome honours live in an installed app. -->
    <meta name="theme-color" content="{{.ThemeColor}}">
    {{if .FollowsSystem}}
    <!-- This account asked to follow the device, and the server cannot know
         which the device is: the client hint that would say is Chromium-only.
         Settled here, before the stylesheet is parsed, so there is nothing to
         correct after the page has painted. ThemeService keeps it true
         afterwards, including when the device changes while the app is open. -->
    <script nonce="{{.Nonce}}">
        (function () {
            var dark = matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.classList.toggle('dark-mode', dark);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', dark ? '#1a1a1a' : '#ffffff');
        })();
    </script>
    {{end}}
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="manifest" href="/manifest.json">
    <title>{{if .ProjectName}}{{.ProjectName}}{{else}}Lastboard{{end}}</title>
    <link rel="stylesheet" href="/styles/theme.css?v=54">
    <link rel="stylesheet" href="/styles/components.css?v=54">
    <script nonce="{{.Nonce}}">
        window.LASTBOARD_CONFIG = {
            API_BASE_URL: '', // Root-relative for local Go server
            DEBUG_MODE: false,
            demo_mode: '{{.DemoMode}}' === 'true'
        };
    </script>
    <script type="module" src="bundle.js?v=54"></script>
</head>

<body>
    <!-- Utility Components -->
    <app-topbar id="main-topbar" title="{{if .ProjectName}}{{.ProjectName}}{{else}}Lastboard{{end}}"></app-topbar>
    <app-right-drawer id="right-drawer"></app-right-drawer>
    <app-notifier></app-notifier>

    <div class="main-content">
        <div id="dashboard-root">
            <!-- Modular Bookmark and Section components injected here -->
        </div>
    </div>
</body>

</html>
