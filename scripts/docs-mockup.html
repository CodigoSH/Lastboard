<!doctype html>
<!--
  The marketing mockup, composed in a browser instead of assembled by hand.

  The one it replaces was a stock photograph of a monitor on a wooden desk with
  a red sky behind it: the screen was a low-resolution paste whose bookmark
  labels were illegible, the phone showed a different dashboard from the
  desktop, the type was neither the brand's typeface nor its wording, and the
  board inside was in Spanish on an English site. None of that could be
  regenerated when the interface changed.

  This can. The frames are drawn, the background is the site's own atmosphere,
  the type is the brand's, and the two screens are real screenshots of the same
  board taken minutes earlier by scripts/docs-shots.ts.

  Rendered by scripts/docs-mockup.ts — not served to anyone.
-->
<meta charset="utf-8">
<title>Lastboard mockup</title>
<style>
    :root {
        --accent: #e8520e;
        --ink: #f5f5f7;
        --dim: #a1a1aa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: #0b0b0d;
        /* The same stack the app itself declares, so the wording in the
           mockup and the interface beside it are set in one typeface. No font
           is vendored for this: Lastboard does not ship one either. */
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--ink);
        position: relative;
        display: grid;
        grid-template-columns: 470px 1fr;
        align-items: center;
    }

    /* The site's atmosphere: a warm glow off the top, and the faint grid the
       constellation sits on. */
    .glow {
        position: absolute;
        inset: 0;
        background:
            radial-gradient(900px 520px at 22% 8%, rgba(232, 82, 14, 0.20), transparent 68%),
            radial-gradient(1100px 700px at 78% 100%, rgba(232, 82, 14, 0.10), transparent 62%);
    }

    .grid {
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(1200px 700px at 40% 40%, #000 20%, transparent 75%);
    }

    /* ── Left: the words ─────────────────────────────────────────────── */
    .copy {
        position: relative;
        padding: 0 0 0 88px;
    }

    .lockup {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 34px;
    }

    .lockup img { width: 54px; height: 54px; }

    .lockup span {
        font-size: 38px;
        font-weight: 600;
        letter-spacing: -0.03em;
    }

    h1 {
        font-size: 62px;
        line-height: 1.04;
        font-weight: 700;
        letter-spacing: -0.035em;
        margin-bottom: 26px;
    }

    h1 em {
        font-style: normal;
        color: var(--accent);
    }

    p {
        font-size: 21px;
        line-height: 1.5;
        color: var(--dim);
        max-width: 30ch;
    }

    .badges {
        display: flex;
        gap: 10px;
        margin-top: 38px;
    }

    .badge {
        font-size: 14px;
        font-weight: 500;
        color: var(--dim);
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 999px;
        padding: 7px 15px;
    }

    /* ── Right: the screens ──────────────────────────────────────────── */
    .stage {
        position: relative;
        height: 100%;
    }

    /* A laptop lid: a thin bezel with a bar at the top, nothing skeuomorphic. */
    .laptop {
        position: absolute;
        top: 176px;
        left: 10px;
        width: 1010px;
        border-radius: 14px;
        background: #17171a;
        border: 1px solid rgba(255, 255, 255, 0.10);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.6);
        overflow: hidden;
    }

    .bar {
        height: 26px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
        background: #202024;
    }

    .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a3a40; }

    .laptop img { display: block; width: 100%; }

    /* The phone overlaps the laptop's corner, showing the same board. */
    .phone {
        position: absolute;
        top: 300px;
        right: 26px;
        width: 244px;
        border-radius: 30px;
        background: #17171a;
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 9px;
        box-shadow: 0 34px 70px rgba(0, 0, 0, 0.6);
        overflow: hidden;
    }

    .phone img {
        display: block;
        width: 100%;
        border-radius: 22px;
    }
</style>

<div class="glow"></div>
<div class="grid"></div>

<div class="copy">
    <div class="lockup">
        <img src="__LOGO__" alt="">
        <span>Lastboard</span>
    </div>
    <h1>Every service you run,<br><em>one page.</em></h1>
    <p>A fast, private dashboard for your homelab — bookmarks, widgets and uptime monitoring in a single binary.</p>
    <div class="badges">
        <div class="badge">Self-hosted</div>
        <div class="badge">Single binary</div>
        <div class="badge">Apache-2.0</div>
    </div>
</div>

<div class="stage">
    <div class="laptop">
        <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
        <img src="__DESKTOP__" alt="">
    </div>
    <div class="phone"><img src="__MOBILE__" alt=""></div>
</div>
