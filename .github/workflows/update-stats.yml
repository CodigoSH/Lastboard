name: Update Install Count

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate total downloads and latest version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          TOTAL=$(gh api repos/CodigoSH/Lastboard/releases \
            --paginate --jq '[.[].assets[].download_count] | add' | \
            paste -sd+ | bc)

          LATEST=$(gh api repos/CodigoSH/Lastboard/releases \
            --paginate --jq '.[] | select(.prerelease == false) | .tag_name' | \
            head -1)

          CONTENT="{\"downloads\":$TOTAL,\"version\":\"$LATEST\"}"
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{"files":{"stats.json":{"content":$content}}}')

          curl -s -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            https://api.github.com/gists/9f912610d0a33f16728a4ecf26bb6937
