name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: |
          go mod download
          bun install

      - name: Build frontend
        run: bun run build

      - name: Run Go tests
        run: go test ./internal/... -v -cover -coverprofile=coverage.out

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out -o=coverage.txt
          cat coverage.txt

      - name: Upload coverage report
        # Keep @v3: Forgejo's GHES-like backend does not support @actions/artifact
        # v2 (upload-artifact@v4+). Do not bump.
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt

      - name: Run Frontend Tests
        run: bun test

      - name: Build backend
        run: go build -v -o bin/lastboard ./cmd/lastboard

      - name: Verify binary
        run: ./bin/lastboard --version

  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: |
          go mod download
          bun install

      - name: Build frontend
        run: bun run build

      - name: Run benchmarks
        run: |
          go test ./internal/... -bench=. -benchmem -run=^$ > benchmark.txt
          cat benchmark.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: benchmark.txt

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Install dependencies
        run: go mod download

      - name: Run Gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0
          gosec -no-fail -fmt sarif -out results.sarif ./...

      - name: Upload SARIF results
        uses: actions/upload-artifact@v3
        with:
          name: gosec-results
          path: results.sarif
