name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # `ubuntu-latest` is a label the runner translates, and by default it lands
    # on a Node image built on Debian bullseye — 2021, OpenSSL 1.1.1w. Pinned so
    # what this runs on is a decision in the diff rather than a line in a config
    # file on the server that nothing versions. See the house rule in
    # codigosh/releases.md.
    container: node:24-trixie
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: |
          go mod download
          bun install

      - name: Build frontend
        run: bun run build

      - name: Run Go tests
        # -race catches data races (the WS hub and stores use goroutines).
        run: go test ./internal/... -race -v -cover -coverprofile=coverage.out

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out -o=coverage.txt
          cat coverage.txt

      - name: Upload coverage report
        # Keep @v3: Forgejo's GHES-like backend does not support @actions/artifact
        # v2 (upload-artifact@v4+). Do not bump.
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt

      # `bun build` strips types without checking them.
      - name: Typecheck
        run: bun run typecheck

      - name: Run Frontend Tests
        run: bun test --randomize

      - name: Build backend
        run: go build -v -o bin/lastboard ./cmd/lastboard

      - name: Verify binary
        run: ./bin/lastboard --version

  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    # `ubuntu-latest` is a label the runner translates, and by default it lands
    # on a Node image built on Debian bullseye — 2021, OpenSSL 1.1.1w. Pinned so
    # what this runs on is a decision in the diff rather than a line in a config
    # file on the server that nothing versions. See the house rule in
    # codigosh/releases.md.
    container: node:24-trixie
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: |
          go mod download
          bun install

      - name: Build frontend
        run: bun run build

      - name: Run benchmarks
        run: |
          go test ./internal/... -bench=. -benchmem -run=^$ > benchmark.txt
          cat benchmark.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: benchmark.txt

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # `ubuntu-latest` is a label the runner translates, and by default it lands
    # on a Node image built on Debian bullseye — 2021, OpenSSL 1.1.1w. Pinned so
    # what this runs on is a decision in the diff rather than a line in a config
    # file on the server that nothing versions. See the house rule in
    # codigosh/releases.md.
    container: node:24-trixie
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: |
          go mod download
          bun install

      # The frontend is embedded via //go:embed dist/*, so govulncheck and
      # staticcheck (which compile the code) need it built first.
      - name: Build frontend
        run: bun run build

      - name: Run Gosec Security Scanner
        # Non-blocking (-no-fail): the SARIF is reviewed manually because the
        # codebase has several triaged, accepted gosec findings (G124/G202/G204/
        # G304/G402) that are false positives in this self-hosted context.
        # The taint rules v2.30 added (G702 on re-executing itself, G703 on paths it
        # builds, G704 on the services the operator points it at, G706 on logging
        # its own rate-limit key) and G104 on errors that are deliberately not
        # checked (a deferred Close, a response being written) were read through
        # on the same terms; G120 is answered by the MaxBytesReader in front of it.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          gosec -no-fail -fmt sarif -out results.sarif ./...

      - name: Upload SARIF results
        uses: actions/upload-artifact@v3
        with:
          name: gosec-results
          path: results.sarif

      - name: Run govulncheck
        # Blocking: fails the build when the code calls a known-vulnerable
        # symbol in the stdlib or a dependency. Currently clean.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Run staticcheck
        # Blocking static analysis (dead code, misuse, simplifications).
        #
        # Pinned, and pinned to the same version scripts/release.sh runs in its
        # preflight. On @latest the two drift the day a new release adds a
        # check, and then a tag passes locally and this job goes red with
        # nothing to do about it but push another commit.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
