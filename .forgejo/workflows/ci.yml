name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: |
          go mod download
          bun install

      - name: Build frontend
        run: bun run build

      - name: Build backend
        run: go build -v -o bin/lastboard ./cmd/lastboard

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./internal/... -v -short

      - name: Verify binary
        run: ./bin/lastboard --version

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Frontend Test
        run: bun test web/src/services/collisionService.test.ts
