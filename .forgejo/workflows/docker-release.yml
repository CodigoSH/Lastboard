name: Docker Release

on:
  push:
    tags:
      - 'v*'

env:
  PUSH_REGISTRY: 192.168.50.5:3000
  PUBLIC_REGISTRY: git.codigosh.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq docker.io

      - name: Fix Docker socket permissions
        run: chmod 666 /var/run/docker.sock

      - name: Set lowercase image name
        id: vars
        run: echo "image=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PUSH_REGISTRY }}/${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref, 'Beta') }}
            type=raw,value=rc,enable=${{ contains(github.ref, 'RC') }}
            type=ref,event=tag

      - name: Login to registry
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: echo "${FORGEJO_TOKEN}" | docker login ${{ env.PUSH_REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name multiarch --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push multi-arch image
        run: |
          TAGS=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAGS="$TAGS --tag $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            $TAGS \
            --push \
            .
