name: Docker Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: git.codigosh.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: vars
        run: echo "image=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}
          tags: |
            # Semver tags (v1.0.0 -> 1.0.0, 1.0, 1) - Only for stable releases
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

            # Latest tag - Only if it's NOT a pre-release (doesn't contain hyphen)
            type=raw,value=latest,enable=${{ !contains(gitea.ref, '-') }}

            # Beta tag - If version string contains 'Beta'
            type=raw,value=beta,enable=${{ contains(gitea.ref, 'Beta') }}

            # RC tag - If version string contains 'RC'
            type=raw,value=rc,enable=${{ contains(gitea.ref, 'RC') }}

            # Always tag with the full ref name (e.g. 1.1.1-Beta.01)
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
