name: Docker Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: git.codigosh.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq docker.io

      - name: Fix Docker socket permissions
        run: chmod 666 /var/run/docker.sock

      - name: Set lowercase image name
        id: vars
        run: echo "image=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref, 'Beta') }}
            type=raw,value=rc,enable=${{ contains(github.ref, 'RC') }}
            type=ref,event=tag

      - name: Build and push Docker image
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          echo "${FORGEJO_TOKEN}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

          TAG_ARGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS="$TAG_ARGS --tag $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx build \
            $TAG_ARGS \
            --platform linux/amd64,linux/arm64 \
            --push \
            --provenance=false \
            --sbom=false \
            .
