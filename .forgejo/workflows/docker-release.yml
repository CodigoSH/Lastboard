name: Docker Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: git.codigosh.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq docker.io

      - name: Fix Docker socket permissions
        run: chmod 666 /var/run/docker.sock

      - name: Set image name and tag
        id: vars
        run: |
          IMAGE=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          TAG=${GITHUB_REF_NAME}
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Log in to registry
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          echo "${FORGEJO_TOKEN}" | docker login ${{ env.REGISTRY }} \
            -u "${{ github.actor }}" --password-stdin

      - name: Set up QEMU
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build and push amd64
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}
          TAG=${{ steps.vars.outputs.tag }}
          docker build --platform linux/amd64 \
            -t ${IMAGE}:${TAG}-amd64 \
            -t ${IMAGE}:amd64 \
            .
          docker push ${IMAGE}:${TAG}-amd64
          docker push ${IMAGE}:amd64

      - name: Build and push arm64
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}
          TAG=${{ steps.vars.outputs.tag }}
          docker build --platform linux/arm64 \
            -t ${IMAGE}:${TAG}-arm64 \
            -t ${IMAGE}:arm64 \
            .
          docker push ${IMAGE}:${TAG}-arm64
          docker push ${IMAGE}:arm64

      - name: Create and push multi-arch manifest
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}
          TAG=${{ steps.vars.outputs.tag }}
          VERSION=$(echo ${TAG} | sed 's/^v//')

          # Enable experimental features for manifest
          export DOCKER_CLI_EXPERIMENTAL=enabled

          # Main version tag
          docker manifest create ${IMAGE}:${TAG} \
            ${IMAGE}:${TAG}-amd64 \
            ${IMAGE}:${TAG}-arm64
          docker manifest push ${IMAGE}:${TAG}

          # Semver without v prefix
          docker manifest create ${IMAGE}:${VERSION} \
            ${IMAGE}:${TAG}-amd64 \
            ${IMAGE}:${TAG}-arm64
          docker manifest push ${IMAGE}:${VERSION}

          # Channel tag (beta/rc/latest)
          if echo "${TAG}" | grep -qi "Beta"; then
            docker manifest create ${IMAGE}:beta \
              ${IMAGE}:${TAG}-amd64 \
              ${IMAGE}:${TAG}-arm64
            docker manifest push ${IMAGE}:beta
          elif echo "${TAG}" | grep -qi "RC"; then
            docker manifest create ${IMAGE}:rc \
              ${IMAGE}:${TAG}-amd64 \
              ${IMAGE}:${TAG}-arm64
            docker manifest push ${IMAGE}:rc
          else
            docker manifest create ${IMAGE}:latest \
              ${IMAGE}:${TAG}-amd64 \
              ${IMAGE}:${TAG}-arm64
            docker manifest push ${IMAGE}:latest
          fi
