name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    # `ubuntu-latest` is a label the runner translates, and by default it lands
    # on a Node image built on Debian bullseye — 2021, OpenSSL 1.1.1w. Pinned so
    # what this runs on is a decision in the diff rather than a line in a config
    # file on the server that nothing versions. See the house rule in
    # codigosh/releases.md.
    container: node:22-bookworm
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'

      - name: Setup Bun (Frontend)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Build Frontend
        run: |
          bun install
          bun run web/build.ts

      - name: Build Backend
        run: |
          VERSION=${GITHUB_REF_NAME}

          export CGO_ENABLED=0
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}

          go build -trimpath -ldflags "-s -w -extldflags '-static' -X git.codigosh.com/CodigoSH/Lastboard/internal/version.Current=$VERSION" -o lastboard ./cmd/lastboard

      - name: Package
        run: tar -czvf lastboard-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz lastboard

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: lastboard-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    # `ubuntu-latest` is a label the runner translates, and by default it lands
    # on a Node image built on Debian bullseye — 2021, OpenSSL 1.1.1w. Pinned so
    # what this runs on is a decision in the diff rather than a line in a config
    # file on the server that nothing versions. See the house rule in
    # codigosh/releases.md.
    container: node:22-bookworm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: apt-get update -qq && apt-get install -y -qq jq

      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Generate Checksums
        run: |
          find artifacts -name "*.tar.gz" | sort | while read f; do
            sha256sum "$f" | awk '{print $1 "  " $2}' | sed 's|artifacts/[^/]*/||'
          done > artifacts/checksums.txt
          cat artifacts/checksums.txt

      - name: Set up Go (for signing)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'

      - name: Sign checksums.txt
        # If this build carries a public key, clients expect a signature: a
        # release published without one makes every updater fall back to
        # checksum-only with nothing but a warning, which is weaker than what
        # the binary promises. So a missing secret is a failure, not a
        # fallback. A fork with no key embedded still releases unsigned.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if go run ./cmd/sign configured; then
              echo "::error::This build embeds a release public key, so clients will expect"
              echo "::error::checksums.txt.sig. RELEASE_SIGNING_KEY is not set — refusing to"
              echo "::error::publish a release that nobody can verify."
              exit 1
            fi
            echo "No public key embedded and no signing key — shipping an unsigned release."
            exit 0
          fi
          go run ./cmd/sign artifacts/checksums.txt
          echo "Signature:"; cat artifacts/checksums.txt.sig

      - name: Debug - List Files
        run: |
          echo "Checking for release notes:"
          ls -l RELEASE_NOTES_${GITHUB_REF_NAME}.md || echo "Release notes file not found, will use default."
          echo "Checking for artifacts:"
          ls -R artifacts/

      - name: Create or Update Release
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          API="${GITHUB_SERVER_URL}/api/v1"
          NOTES_FILE="RELEASE_NOTES_${VERSION}.md"

          # Detect prerelease
          IS_PRERELEASE=false
          if [[ "$VERSION" == *"Beta"* || "$VERSION" == *"RC"* || "$VERSION" == *"beta"* || "$VERSION" == *"rc"* ]]; then
            IS_PRERELEASE=true
          fi

          # Read release notes
          if [ -f "$NOTES_FILE" ]; then
            NOTES=$(cat "$NOTES_FILE")
          else
            NOTES="Release $VERSION"
          fi

          NOTES_JSON=$(echo "$NOTES" | jq -Rs .)

          # Check if release already exists
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $CI_TOKEN" \
            "$API/repos/$REPO/releases/tags/$VERSION")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Release exists, updating..."

            RELEASE_ID=$(curl -s \
              -H "Authorization: token $CI_TOKEN" \
              "$API/repos/$REPO/releases/tags/$VERSION" | jq -r '.id')

            # Hide the release while we swap assets so clients don't see it
            # (and prompt an update) with missing/partial downloads.
            curl -s -X PATCH \
              -H "Authorization: token $CI_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"$VERSION\", \"body\": $NOTES_JSON, \"prerelease\": $IS_PRERELEASE, \"draft\": true}" \
              "$API/repos/$REPO/releases/$RELEASE_ID"

            # Delete existing assets before re-uploading
            ASSET_IDS=$(curl -s \
              -H "Authorization: token $CI_TOKEN" \
              "$API/repos/$REPO/releases/$RELEASE_ID/assets" | jq -r '.[].id')
            for asset_id in $ASSET_IDS; do
              curl -s -X DELETE \
                -H "Authorization: token $CI_TOKEN" \
                "$API/repos/$REPO/releases/$RELEASE_ID/assets/$asset_id"
            done
          else
            echo "Creating new release..."

            # Create as draft: not returned by /releases/latest or /releases,
            # so the update check won't surface it until assets are uploaded.
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $CI_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"$VERSION\", \"name\": \"$VERSION\", \"body\": $NOTES_JSON, \"prerelease\": $IS_PRERELEASE, \"draft\": true}" \
              "$API/repos/$REPO/releases" | jq -r '.id')
          fi

          echo "Release ID: $RELEASE_ID"

          # Upload tar.gz files
          find artifacts -name "*.tar.gz" | while read f; do
            filename=$(basename "$f")
            echo "Uploading $filename..."
            curl -s -X POST \
              -H "Authorization: token $CI_TOKEN" \
              -F "attachment=@$f;filename=$filename" \
              "$API/repos/$REPO/releases/$RELEASE_ID/assets"
          done

          # Upload checksums
          echo "Uploading checksums.txt..."
          curl -s -X POST \
            -H "Authorization: token $CI_TOKEN" \
            -F "attachment=@artifacts/checksums.txt;filename=checksums.txt" \
            "$API/repos/$REPO/releases/$RELEASE_ID/assets"

          # Upload the signature too, when the release was signed.
          if [ -f artifacts/checksums.txt.sig ]; then
            echo "Uploading checksums.txt.sig..."
            curl -s -X POST \
              -H "Authorization: token $CI_TOKEN" \
              -F "attachment=@artifacts/checksums.txt.sig;filename=checksums.txt.sig" \
              "$API/repos/$REPO/releases/$RELEASE_ID/assets"
          fi

          # Publish: all assets are uploaded, so flip draft off. Only now does the
          # release become visible to the update check, guaranteeing the binary and
          # checksums.txt exist before any client can attempt to download them.
          echo "Publishing release (draft -> false)..."
          curl -s -X PATCH \
            -H "Authorization: token $CI_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"draft\": false}" \
            "$API/repos/$REPO/releases/$RELEASE_ID"

  # Retention: only after the release is successfully published (needs: release)
  # do we dispatch the pruner. Gating on success guarantees we never delete the
  # cycle's betas for a release that failed to ship, and by now the releases API
  # already lists this version (no race — the previous tag-push trigger was the bug).
  trigger-prune:
    name: Trigger retention prune
    needs: release
    runs-on: ubuntu-latest
    # `ubuntu-latest` is a label the runner translates, and by default it lands
    # on a Node image built on Debian bullseye — 2021, OpenSSL 1.1.1w. Pinned so
    # what this runs on is a decision in the diff rather than a line in a config
    # file on the server that nothing versions. See the house rule in
    # codigosh/releases.md.
    container: node:22-bookworm
    steps:
      - name: Dispatch prune-releases (live) after successful publish
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $CI_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"dry_run":"false"}}' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/prune-releases.yml/dispatches")
          echo "Prune dispatch HTTP $CODE"
          [ "$CODE" = "204" ] || { echo "Prune dispatch failed (HTTP $CODE)"; exit 1; }

  # The website reads the latest release from the Forgejo API at build time, and
  # its Coolify deploy webhook fires on push — which happens minutes before this
  # release exists (and while it is still a draft). A site built then advertises
  # the previous version until some unrelated push rebuilds it. Rebuilding here,
  # gated on a published release, is the only trigger that sees this version.
  trigger-site-rebuild:
    name: Rebuild the website
    needs: release
    runs-on: ubuntu-latest
    # `ubuntu-latest` is a label the runner translates, and by default it lands
    # on a Node image built on Debian bullseye — 2021, OpenSSL 1.1.1w. Pinned so
    # what this runs on is a decision in the diff rather than a line in a config
    # file on the server that nothing versions. See the house rule in
    # codigosh/releases.md.
    container: node:22-bookworm
    steps:
      - name: Redeploy codigosh-web after successful publish
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          # Optional: releases must not fail because the hook is not configured.
          if [ -z "$COOLIFY_DEPLOY_URL" ] || [ -z "$COOLIFY_DEPLOY_TOKEN" ]; then
            echo "Coolify deploy secrets not set — skipping website rebuild."
            exit 0
          fi
          # The endpoint authenticates with a Coolify API token; without the
          # header it answers 401.
          #
          # Which verb it wants depends on which URL is in the secret: Coolify's
          # API deploy endpoint (/api/v1/deploy?uuid=…) is a GET, and a deploy
          # webhook is a POST. Asking with the wrong one answers 405, which is
          # what silently stopped the site being rebuilt after v1.7.0 — the
          # release went out and the website went on advertising 1.6.2. So it
          # asks one way and, only if the answer is "wrong method", the other.
          # force=true matters more than it looks. Coolify only redeploys when the
          # commit touches its configured Watch Paths, and when it doesn't it
          # skips the deployment and still answers 2xx — which is why a release
          # could report a successful rebuild and leave the site untouched. The
          # site's content comes from this repository's API at build time, so a
          # rebuild is worth doing whatever the commit happened to change.
          URL="$COOLIFY_DEPLOY_URL"
          case "$URL" in
            *\?*) URL="$URL&force=true" ;;
            *)    URL="$URL?force=true" ;;
          esac
          ask() {
            curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X "$1" \
              -H "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
              "$URL"
          }
          CODE=$(ask GET)
          if [ "$CODE" = "405" ]; then
            echo "Website rebuild: GET answered 405, retrying as POST"
            CODE=$(ask POST)
          fi
          echo "Website rebuild HTTP $CODE"
          case "$CODE" in
            2*) echo "Website rebuild requested." ;;
            *)  echo "Website rebuild failed (HTTP $CODE)"; exit 1 ;;
          esac
