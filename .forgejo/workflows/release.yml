name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    # `ubuntu-latest` is a label the runner translates, and by default it lands
    # on a Node image built on Debian bullseye — 2021, OpenSSL 1.1.1w. Pinned so
    # what this runs on is a decision in the diff rather than a line in a config
    # file on the server that nothing versions. See the house rule in
    # codigosh/releases.md.
    container: node:24-trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run web/build.ts

      - name: Build binaries
        # Both architectures in one job: with CGO off Go cross-compiles, so a job
        # per architecture only repeated the checkout and the frontend build and
        # had to hand its binary to the next job as a stored artifact.
        #
        # The names are a contract: the web updater and install.sh ask for
        # lastboard-linux-<arch>.tar.gz with the binary at the archive's root,
        # and checksums.txt beside it.
        #
        # -tags timetzdata embeds the time zone database, as the container image
        # always did: the image has no /usr/share/zoneinfo and now carries this
        # very binary. On a machine that has the database, Go reads that one.
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist
          for arch in amd64 arm64; do
            mkdir -p "build/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -tags timetzdata \
              -ldflags "-s -w -extldflags '-static' -X git.codigosh.com/CodigoSH/Lastboard/internal/version.Current=$VERSION" \
              -o "build/$arch/lastboard" ./cmd/lastboard
            tar -czf "dist/lastboard-linux-$arch.tar.gz" -C "build/$arch" lastboard
          done
          (cd dist && sha256sum lastboard-linux-*.tar.gz > checksums.txt)
          cat dist/checksums.txt

      - name: Sign checksums.txt
        # If this build carries a public key, clients expect a signature: a
        # release published without one makes every updater fall back to
        # checksum-only with nothing but a warning, which is weaker than what
        # the binary promises. So a missing secret is a failure, not a
        # fallback. A fork with no key embedded still releases unsigned.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if go run ./cmd/sign configured; then
              echo "::error::This build embeds a release public key, so clients will expect"
              echo "::error::checksums.txt.sig. RELEASE_SIGNING_KEY is not set — refusing to"
              echo "::error::publish a release that nobody can verify."
              exit 1
            fi
            echo "No public key embedded and no signing key — shipping an unsigned release."
            exit 0
          fi
          go run ./cmd/sign dist/checksums.txt
          echo "Signature:"; cat dist/checksums.txt.sig

      # ---- the container image, from the binaries above -------------------
      #
      # The image used to be a workflow of its own that compiled the same commit
      # again inside the Dockerfile, for each architecture: two more builds per
      # release and a second slot of the runner, for a binary that was not the
      # one in the tarballs. Now it is these binaries, copied: what is pulled is
      # what the updater downloads, checked by the same checksums.txt.
      #
      # Before the release is created, so that an image that cannot be built
      # stops the release instead of leaving a release with no image beside it.
      - name: Binaries for the image
        run: |
          mkdir -p image-bin
          for arch in amd64 arm64; do
            cp "build/$arch/lastboard" "image-bin/lastboard-linux-$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "image-bin/healthcheck-linux-$arch" ./cmd/healthcheck
            # The file inside the published tarball, and not only the same name.
            tar -xzOf "dist/lastboard-linux-$arch.tar.gz" lastboard | cmp - "image-bin/lastboard-linux-$arch"
          done
          ls -la image-bin

      # The Docker socket is mounted into the job container whatever image it
      # runs on (act/runner/run_context.go, platformImage and GetBindsAndMounts,
      # forgejo-runner v13.2.0).
      - name: Install Docker CLI and Buildx
        run: |
          # Retry transient gateway errors (e.g. 504) on external downloads.
          CURL="curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30"

          # Docker CLI static binary (pinned, no apt/systemd deps)
          $CURL "https://download.docker.com/linux/static/stable/x86_64/docker-29.9.2.tgz" \
            | tar xz --strip-components=1 -C /usr/local/bin docker/docker

          # Buildx plugin (pinned)
          mkdir -p /usr/lib/docker/cli-plugins
          $CURL "https://github.com/docker/buildx/releases/download/v0.38.1/buildx-v0.38.1.linux-amd64" \
            -o /usr/lib/docker/cli-plugins/docker-buildx
          chmod +x /usr/lib/docker/cli-plugins/docker-buildx

      - name: Set lowercase image name
        id: vars
        run: echo "image=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Decide which moving tags this version may take
        id: moving
        run: |
          # A moving tag goes only to the newest version of its kind. A tag pushed
          # again for an old release (a history rewrite does that) must not take
          # `latest` back to it: on 24-oct-2026 a re-pushed v1.0.6 did, and
          # `:latest` served a June image for days.
          this="${GITHUB_REF_NAME#v}"
          names=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##')
          # No match is an answer (a repository with no beta yet), not an error: the
          # runner's shell stops on a failed command inside a pipeline.
          [ -n "$names" ] || { echo "no version tags found on the remote: refusing to guess"; exit 1; }
          newest() { { printf '%s\n' "$names" | grep -E "$1" || true; } | sort -V | tail -n 1; }
          stable=$(newest '^[0-9]+\.[0-9]+\.[0-9]+$')
          beta=$(newest '^[0-9]+\.[0-9]+\.[0-9]+-[Bb]eta')
          rc=$(newest '^[0-9]+\.[0-9]+\.[0-9]+-(RC|rc)')
          [ "$this" = "$stable" ] && echo "latest=true" >> "$GITHUB_OUTPUT" || echo "latest=false" >> "$GITHUB_OUTPUT"
          [ "$this" = "$beta" ] && echo "beta=true" >> "$GITHUB_OUTPUT" || echo "beta=false" >> "$GITHUB_OUTPUT"
          [ "$this" = "$rc" ] && echo "rc=true" >> "$GITHUB_OUTPUT" || echo "rc=false" >> "$GITHUB_OUTPUT"
          echo "v$this — newest stable v$stable, beta v$beta, rc v$rc"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: git.codigosh.com/${{ steps.vars.outputs.image }}
          # `latest` is decided by the step above and nowhere else. The action's
          # default flavour is `latest=auto`, which adds the tag to whatever it
          # judges to be the newest release — and it judges by parsing the
          # version. A tag like v1.7.0-Beta.09 is not valid semver (a numeric
          # prerelease identifier may not carry a leading zero), so the parse
          # failed and it moved `latest` onto that beta.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.moving.outputs.latest == 'true' }}
            type=raw,value=beta,enable=${{ steps.moving.outputs.beta == 'true' }}
            type=raw,value=rc,enable=${{ steps.moving.outputs.rc == 'true' }}
            type=ref,event=tag

      - name: Login to registry
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: echo "${CI_TOKEN}" | docker login git.codigosh.com -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name multiarch --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push multi-arch image
        run: |
          TAGS=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAGS="$TAGS --tag $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

          # BINARIES=prebuilt: the image takes image-bin/ instead of compiling.
          # Nothing runs on the target platform, so neither architecture is
          # emulated. See the Dockerfile.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg BINARIES=prebuilt \
            $TAGS \
            --push \
            .

      - name: Create or update the release
        # Every call is checked. Uploads used to go through `curl -s`, which
        # exits 0 on an HTTP error, and the step then took the draft flag off:
        # a forge that refused a file (a full disk does that) would have
        # published a release without its binary, and every updater would have
        # failed on it.
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${CI_TOKEN:-}" ] || { echo "CI_TOKEN is not set" >&2; exit 1; }
          VERSION="${GITHUB_REF_NAME}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"

          # Prints the body; fails, saying why, on anything but a 2xx.
          api() {
            local method=$1 url=$2 out code
            shift 2
            out=$(curl -sS -w '\n%{http_code}' -X "$method" -H "Authorization: token $CI_TOKEN" "$@" "$url")
            code=${out##*$'\n'}
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "$method $url answered HTTP $code" >&2
              printf '%s\n' "${out%$'\n'*}" >&2
              return 1
            fi
            printf '%s' "${out%$'\n'*}"
          }
          json_id() { python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])'; }

          case "$VERSION" in
            *Beta*|*beta*|*RC*|*rc*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac

          NOTES_FILE="RELEASE_NOTES_${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then NOTES=$(cat "$NOTES_FILE"); else NOTES="Release $VERSION"; fi

          # A draft is not returned by /releases/latest, so the update check
          # cannot offer this version until every file is on it.
          payload=$(VERSION="$VERSION" NOTES="$NOTES" PRE="$PRERELEASE" python3 -c 'import json, os; print(json.dumps({"tag_name": os.environ["VERSION"], "name": os.environ["VERSION"], "body": os.environ["NOTES"], "prerelease": os.environ["PRE"] == "true", "draft": True}))')

          existing=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: token $CI_TOKEN" "$API/releases/tags/$VERSION")
          case "$existing" in
            200)
              echo "The release exists: hiding it while its files are replaced."
              id=$(api GET "$API/releases/tags/$VERSION" | json_id)
              api PATCH "$API/releases/$id" -H 'Content-Type: application/json' -d "$payload" > /dev/null
              for asset in $(api GET "$API/releases/$id/assets" | python3 -c 'import json,sys; [print(a["id"]) for a in json.load(sys.stdin)]'); do
                api DELETE "$API/releases/$id/assets/$asset" > /dev/null
              done
              ;;
            404)
              id=$(api POST "$API/releases" -H 'Content-Type: application/json' -d "$payload" | json_id)
              ;;
            *)
              echo "Asking whether $VERSION has a release answered HTTP $existing" >&2
              exit 1
              ;;
          esac
          echo "Release ID: $id"

          for file in dist/*; do
            name=$(basename "$file")
            echo "Uploading $name"
            api POST "$API/releases/$id/assets?name=$name" -F "attachment=@$file" > /dev/null
          done

          api PATCH "$API/releases/$id" -H 'Content-Type: application/json' -d '{"draft": false}' > /dev/null
          echo "Published $VERSION"

      - name: The release has everything it was built with
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          published=$(curl -sSf -H "Authorization: token $CI_TOKEN" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            | python3 -c 'import json,sys; [print(a["name"]) for a in json.load(sys.stdin).get("assets", [])]' | sort)
          expected=$(cd dist && ls | sort)
          missing=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$published"))
          if [ -n "$missing" ]; then
            echo "These were built and are not on the release:" >&2
            printf '  %s\n' $missing >&2
            exit 1
          fi
          echo "Published: $(printf '%s\n' "$published" | tr '\n' ' ')"

      - name: A beta is not offered on the stable channel
        run: |
          case "$GITHUB_REF_NAME" in
            *Beta*|*beta*|*RC*|*rc*) ;;
            *) echo "A stable release; nothing to check here."; exit 0 ;;
          esac
          latest=$(curl -sSf "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name",""))' 2>/dev/null || true)
          if [ "$latest" = "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME is what /releases/latest answers, and that is what the" >&2
            echo "stable channel asks: it was published without the prerelease flag." >&2
            exit 1
          fi
          echo "The stable channel sees: ${latest:-no stable release yet}"

      # Retention and the website are asked for from here, as the last steps of the release and
      # not as jobs of their own. Each is four seconds of curl, and a job of its own is a slot of
      # the runner, which has one: it went to the back of a queue of everybody else's runs and the
      # release read as running for as long as that took. A step runs only if every step before it
      # passed, which is all the `needs: release` they replace was for.
      #
      # Retention: only after the release is successfully published do we dispatch the pruner.
      # Gating on success guarantees we never delete the cycle's betas for a release that failed to
      # ship, and by now the releases API already lists this version (no race — the previous
      # tag-push trigger was the bug).
      - name: Dispatch prune-releases (live) after successful publish
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $CI_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"dry_run":"false"}}' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/prune-releases.yml/dispatches")
          echo "Prune dispatch HTTP $CODE"
          [ "$CODE" = "204" ] || { echo "Prune dispatch failed (HTTP $CODE)"; exit 1; }

      # The site reads the latest release from the Forgejo API at build time, and a push-triggered
      # build happens minutes before this release exists (and while it is still a draft), so it
      # would advertise the previous version until some unrelated push rebuilt it. Asking here,
      # gated on a published release, is the only trigger that sees this version. Dispatched rather
      # than done here, so how the site is rebuilt lives in one place: site-rebuild.yml.
      - name: Dispatch the website rebuild
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $CI_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"requested_at":"'"$(date +%s)"'"}}' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/site-rebuild.yml/dispatches")
          echo "Website rebuild dispatch HTTP $CODE"
          [ "$CODE" = "204" ] || { echo "Website rebuild dispatch failed (HTTP $CODE)"; exit 1; }
